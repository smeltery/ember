schema-version = "1.16.0"

[install]
bun.pkg-path = "bun"
git.pkg-path = "git"
git.outputs = "all"
gh.pkg-path = "gh"
pre-commit.pkg-path = "pre-commit"
pre-commit.outputs = "all"
actionlint.pkg-path = "actionlint"
shellcheck.pkg-path = "shellcheck"
shellcheck.outputs = "all"
python3.pkg-path = "python3"
bash.pkg-path = "bash"
bash.outputs = "all"
jq.pkg-path = "jq"
jq.outputs = "all"

[hook]
on-activate = '''
  echo "ember: bun $(bun --version 2>/dev/null || echo n/a)"
  echo "ember: flox ready — bun install && pre-commit install && bun run ci"
'''

[options]
systems = ["aarch64-darwin", "x86_64-darwin", "aarch64-linux", "x86_64-linux"]
